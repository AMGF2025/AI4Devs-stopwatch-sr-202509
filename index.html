<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetros y Cuentas Regresivas</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-stopwatch"></i> Cronómetros y Cuentas Regresivas</h1>
            <p>Gestiona múltiples cronómetros simultáneamente</p>
        </header>

        <div class="controls">
            <button id="addTimer" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nuevo Cronómetro
            </button>
            <button id="addCountdown" class="btn btn-secondary">
                <i class="fas fa-clock"></i> Nueva Cuenta Regresiva
            </button>
            <div class="settings-toggle">
                <button id="settingsBtn" class="btn btn-outline">
                    <i class="fas fa-cog"></i> Configuración
                </button>
            </div>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <h3>Configuración</h3>
            <div class="setting-item">
                <label for="soundEnabled">
                    <i class="fas fa-volume-up"></i> Sonido de alerta
                </label>
                <input type="checkbox" id="soundEnabled" checked>
            </div>
            <div class="setting-item">
                <label for="notificationsEnabled">
                    <i class="fas fa-bell"></i> Notificaciones del navegador
                </label>
                <input type="checkbox" id="notificationsEnabled">
            </div>
            <div class="setting-item">
                <label for="theme">
                    <i class="fas fa-palette"></i> Tema
                </label>
                <select id="theme">
                    <option value="light">Claro</option>
                    <option value="dark">Oscuro</option>
                    <option value="auto">Automático</option>
                </select>
            </div>
        </div>

        <div class="timers-container" id="timersContainer">
            <!-- Los cronómetros se agregarán dinámicamente aquí -->
        </div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-stopwatch"></i>
            <h3>No hay cronómetros activos</h3>
            <p>Crea tu primer cronómetro o cuenta regresiva para comenzar</p>
        </div>
    </div>

    <!-- Modal para crear nuevo cronómetro -->
    <div class="modal" id="timerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Cronómetro</h2>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="timerName">Nombre del cronómetro (opcional)</label>
                    <input type="text" id="timerName" placeholder="Dejar vacío para nombre automático">
                </div>
                <div class="form-group" id="countdownGroup" style="display: none;">
                    <label for="countdownTime">Tiempo objetivo</label>
                    <div class="time-inputs">
                        <input type="number" id="hours" min="0" max="23" placeholder="00">
                        <span>:</span>
                        <input type="number" id="minutes" min="0" max="59" placeholder="00">
                        <span>:</span>
                        <input type="number" id="seconds" min="0" max="59" placeholder="00">
                    </div>
                </div>
                <div class="form-group">
                    <label for="timerColor">Color del cronómetro</label>
                    <div class="color-picker">
                        <input type="radio" name="color" value="blue" id="blue" checked>
                        <label for="blue" class="color-option blue"></label>
                        <input type="radio" name="color" value="green" id="green">
                        <label for="green" class="color-option green"></label>
                        <input type="radio" name="color" value="red" id="red">
                        <label for="red" class="color-option red"></label>
                        <input type="radio" name="color" value="purple" id="purple">
                        <label for="purple" class="color-option purple"></label>
                        <input type="radio" name="color" value="orange" id="orange">
                        <label for="orange" class="color-option orange"></label>
                        <input type="radio" name="color" value="teal" id="teal">
                        <label for="teal" class="color-option teal"></label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" id="cancelBtn">Cancelar</button>
                <button class="btn btn-primary" id="createBtn">Crear</button>
            </div>
        </div>
    </div>

    <!-- Notificación de alerta -->
    <div class="alert-notification" id="alertNotification">
        <div class="alert-content">
            <i class="fas fa-bell"></i>
            <div class="alert-text">
                <h4>¡Tiempo completado!</h4>
                <p id="alertMessage"></p>
            </div>
            <button class="alert-close" id="closeAlert">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
